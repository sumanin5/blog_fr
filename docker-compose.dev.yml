# ==========================================
# 开发环境 Docker Compose
# ==========================================
# 用法：docker compose -f docker-compose.dev.yml up
#
# 区别于生产环境：
# • 使用 development 阶段（包含 pytest、jupyter）
# • 挂载源代码卷（有热更新）
# • 更详细的日志输出
# • 禁用健康检查重启

services:
  # ==========================================
  # PostgreSQL 数据库
  # ==========================================
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 性能优化参数
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAX_CONNECTIONS: 200
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - fsync=off  # 开发环境可关闭，提升性能
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 宿主机 5433 → 容器 5432
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 后端 API（开发模式）
  # ==========================================
  backend:
    # 构建开发镜像
    build:
      context: ./backend
      target: development # ← 关键：使用 development 阶段
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"  # <--- 与宿主机一致，避免挂载文件权限问题
    # 挂载源代码（热更新）
    volumes:
      - ./backend:/app
      - ./.git:/git_root/.git
      - ./.git/modules/content:/git_root/.git/modules/content  # submodule 支持
      - ./content:/git_root/content
      - ~/.ssh:/tmp/.ssh:ro  # SSH key 用于 Git 推送 (挂载到新的 HOME)
      - /app/.venv

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      CONTENT_DIR: /git_root/content
      # 解决 Docker 挂载导致的 Git 仓库识别问题
      GIT_DISCOVERY_ACROSS_FILESYSTEM: "1"
      GIT_CONFIG_PARAMETERS: "'safe.directory=*'"
      HOME: /tmp

    depends_on:
      db:
        condition: service_healthy

    # 开发模式：启用热更新（--reload 下 --workers 会被忽略，已去掉）
    # 先执行迁移再启动：新机器首次 up 时空库无表，upgrade head 是幂等的，已是最新时直接跳过
    command: sh -c "alembic upgrade head && exec fastapi run app/main.py --reload"

  # ==========================================
  # 前端（开发模式）
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"  # 使用宿主机用户，避免权限问题

    # 挂载源代码（热更新）
    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - BACKEND_INTERNAL_URL=http://backend:8000
      - HOME=/tmp  # pnpm/Next 的运行时缓存写 /tmp，避免往 root 家目录写无权限

    depends_on:
      - backend

# ==========================================
# 数据卷
# ==========================================
volumes:
  postgres_data:
