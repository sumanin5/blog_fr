name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend-checks:
    uses: ./.github/workflows/backend-ci.yml

  frontend-checks:
    uses: ./.github/workflows/frontend-ci.yml

  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACR_REGISTRY: crpi-qvig00qix6yo4bi5.cn-hangzhou.personal.cr.aliyuncs.com
      ACR_NAMESPACE: blog-project
      DEPLOY_PATH: /home/tomy/blog_fr
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout the checked release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Login to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin

      - name: Build and push release images
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for service in backend frontend caddy; do
            image="$ACR_REGISTRY/$ACR_NAMESPACE/blog-$service:$IMAGE_TAG"
            if [ "$service" = frontend ]; then
              docker build --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" -t "$image" "$service"
            else
              docker build -t "$image" "$service"
            fi
            docker push "$image"
          done

      - name: Upload the checked release configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_IP }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: docker-compose.yml,scripts/deploy-release.sh
          target: ${{ env.DEPLOY_PATH }}/.deploy/${{ github.sha }}

      - name: Migrate and deploy the release
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.ECS_IP }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          envs: DEPLOY_PATH,IMAGE_TAG,ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 15m
          script: |
            set -eu
            printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
            bash "$DEPLOY_PATH/.deploy/$IMAGE_TAG/scripts/deploy-release.sh" "$DEPLOY_PATH" "$IMAGE_TAG"
