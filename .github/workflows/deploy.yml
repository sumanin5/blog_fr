name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend-checks:
    uses: ./.github/workflows/backend-ci.yml

  frontend-checks:
    uses: ./.github/workflows/frontend-ci.yml

  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACR_REGISTRY: crpi-qvig00qix6yo4bi5.cn-hangzhou.personal.cr.aliyuncs.com
      ACR_NAMESPACE: blog-project
      DEPLOY_PATH: /home/tomy/blog_fr
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout the checked release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Login to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin

      # buildx + GitHub Actions 缓存：依赖未变时复用缓存层，层 digest 不变，
      # 推送到 ACR 时这些层已存在而被跳过，跨境只上传代码变化的层。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: backend
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/blog-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          # 保持单一镜像清单，与此前 docker build/push 的产物一致
          provenance: false
          sbom: false

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: frontend
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/blog-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: false
          sbom: false

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        timeout-minutes: 10
        with:
          context: caddy
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/blog-caddy:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max
          provenance: false
          sbom: false

      - name: Upload the checked release configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_IP }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          source: docker-compose.yml,scripts/deploy-release.sh
          target: ${{ env.DEPLOY_PATH }}/.deploy/${{ github.sha }}

      - name: Migrate and deploy the release
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.ECS_IP }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          envs: DEPLOY_PATH,IMAGE_TAG,ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 15m
          script: |
            set -eu
            printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
            bash "$DEPLOY_PATH/.deploy/$IMAGE_TAG/scripts/deploy-release.sh" "$DEPLOY_PATH" "$IMAGE_TAG"
